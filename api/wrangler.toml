# Cloudflare Worker configuratie voor de Wijnkelder-API.
# Pas de waarden onder [vars] aan naar jouw GitHub Pages-adres.

name = "wijnkelder-api"
main = "src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Het exacte adres waar de webapp draait (zonder slash aan het einde).
# Voorbeeld GitHub Pages: https://tije.github.io
ORIGIN = "https://TJ-Strataig.github.io"
# De hostnaam van bovenstaand adres. Dit is de "Relying Party ID" voor passkeys.
RP_ID = "TJ-Strataig.github.io"
RP_NAME = "Wijnkelder van Angela & Tije"
# AI is standaard in te stellen IN DE APP (Instellingen â†’ AI-sommelier, alleen beheerder):
# daar kies je Anthropic (Claude) of OpenAI, het model en voer je de API-sleutel in.
# De onderstaande waarden zijn optioneel en dienen alleen als terugvaloptie als er in de app niets is ingesteld.
# AI_PROVIDER = "anthropic"          # of "openai"
# AI_MODEL = "claude-sonnet-4-5"
# AI_BASE_URL = "https://api.anthropic.com"

# Secrets (NIET hier invullen, maar via `wrangler secret put <NAAM>`):
#   SESSION_SECRET   - lange willekeurige string (>= 32 tekens), voor ondertekende foto-links
#   BOOTSTRAP_SECRET - eenmalig wachtwoord om de allereerste beheerder aan te maken
#   AI_API_KEY       - (optioneel) terugval-sleutel voor het AI-model; normaal stel je die in de app in
#   BRAVE_API_KEY    - (optioneel) Brave Search API voor prijsindicaties op basis van echte webresultaten

[[d1_databases]]
binding = "DB"
database_name = "wijnkelder"
database_id = "518a6439-4e26-4efa-a512-b8fef052d480"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "wijnkelder-fotos"

[observability]
enabled = true

[triggers]
crons = ["30 3 * * *"]
