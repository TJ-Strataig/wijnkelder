name: Geisoleerde Cloudflare-publicatieproef

on:
  push:
    branches: [tj-strataig-ontwikkelbasis-herstellen]
    paths: ['.github/workflows/cloudflare-deploy-probe.yml', 'api/scripts/cloudflare-deploy-probe.mjs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/tj-strataig-ontwikkelbasis-herstellen'
    uses: ./.github/workflows/checks.yml

  probe:
    needs: checks
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Afzonderlijke configuratie en vrije naam controleren
        id: prepare
        run: node scripts/cloudflare-deploy-probe.mjs prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Alleen de tijdelijke testworker publiceren
        run: npx --no-install wrangler deploy --config "$RUNNER_TEMP/wijnkelder-probe/wrangler.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Testdeployment bevestigen
        run: node scripts/cloudflare-deploy-probe.mjs verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Alleen de eigen testworker verwijderen en afwezigheid bevestigen
        if: ${{ always() && steps.prepare.outputs.cleanup_allowed == 'true' }}
        run: node scripts/cloudflare-deploy-probe.mjs cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
