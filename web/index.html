<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://*.workers.dev https://*.tile.opentopomap.org https://tile.openstreetmap.org; connect-src 'self' https://*.workers.dev; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#5a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="De gezamenlijke wijnkelder van Angela & Tije" />
  <title>Wijnkelder</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Wijnkelder" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>
  <a class="skip" href="#main">Naar inhoud</a>
  <div id="app" class="app">
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#/kelder">
        <img src="icons/icon.svg" alt="" width="28" height="28" />
        <span>Wijnkelder</span>
      </a>
      <nav class="sidenav" id="sidenav" aria-label="Hoofdmenu"></nav>
      <div class="topbar-right">
        <button class="icon-btn bell" id="bell" title="Meldingen" aria-label="Meldingen">🔔</button>
        <button class="icon-btn" id="theme-toggle" title="Donker/licht thema" aria-label="Thema wisselen">◐</button>
        <span class="user-chip" id="user-chip"></span>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
    <nav class="bottomnav" id="bottomnav" aria-label="Menu" hidden></nav>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
